[project]
name = "deeplearning-final-project"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beartype>=0.22.9",
  "bs-roformer>=1.1.0",
  "einops>=0.8.2",
  "librosa>=0.11.0",
  "ml-collections>=1.1.0",
  "pyyaml>=6.0.3",
  "rotary-embedding-torch>=0.8.9",
  "soundfile>=0.13.1",
  "torch>=2.11.0",
]

[dependency-groups]
dev = ["bs-roformer-infer>=0.1.1"]

[tool.uv]
exclude-newer = "1 week"
